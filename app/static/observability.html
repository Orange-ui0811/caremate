<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>客小助 CareMate · 观测与成本</title>
  <link rel="icon" type="image/svg+xml" href="/static/brand.svg" />
  <style>
    .kpis { display: grid; gap: 12px; grid-template-columns: repeat(4, 1fr); margin-top: 4px; }
    @media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
    .kpi {
      background: var(--paper); border: 1px solid var(--hairline); box-shadow: var(--shadow-sm);
      padding: 10px 13px 12px;
    }
    .kpi .k-label { font-size: 11.5px; color: var(--muted); }
    .kpi .k-val { font-size: 25px; font-weight: 700; line-height: 1.4; font-variant-numeric: tabular-nums; }
    .kpi .k-val small { font-size: 13px; margin-left: 2px; }
    .kpi .k-sub { font-size: 11.5px; color: var(--text-2); line-height: 1.7; }

    /* 占比条:一条一意图,长度即占比 */
    .shares { margin-top: 14px; display: flex; flex-direction: column; gap: 11px; }
    .sh-label { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px; }
    .sh-label .nm b { font-weight: 700; }
    .sh-label .nm span { color: var(--muted); font-size: 11px; margin-left: 7px; }
    .sh-label .pv { font-variant-numeric: tabular-nums; font-weight: 700; }
    .bar-track { height: 15px; border: 1px solid var(--hairline); background: var(--cream); margin-top: 4px; }
    .bar-fill { height: 100%; display: block; background: var(--sky); }
    .bar-fill.top { background: var(--coral); }

    /* 读图小注 */
    .read {
      margin-top: 13px; border: 1px solid var(--hairline); background: var(--paper);
      padding: 9px 13px; font-size: 12.5px; line-height: 1.8;
    }
    .read b { background: var(--fur); padding: 0 4px; border: 1px solid var(--hairline); }
    .read::before {
      content: "读图"; float: left; font-size: 11px; background: var(--ink); color: var(--cream);
      padding: 1px 7px; margin: 2px 9px 2px 0;
    }

    .subhead { font-size: 13px; font-weight: 700; margin: 16px 0 2px; }
    .subhead .unit { color: var(--muted); font-weight: 400; font-size: 11.5px; margin-left: 7px; }

    table.tbl td.up { color: var(--online); }
    table.tbl td.down { background: var(--error-soft); color: var(--error); font-weight: 700; }
    table.tbl td.flat { color: var(--muted); }
    table.tbl td .arrow { margin-left: 5px; }

    .chart-scroll { overflow-x: auto; }
    svg.chart { display: block; width: 100%; height: auto; min-width: 560px; font-family: inherit; }
    svg .axis { fill: var(--muted); font-size: 11px; }
    svg .glabel { fill: var(--ink); font-size: 12px; font-weight: 700; }
    svg .grid line { stroke: rgba(43,38,50,0.16); stroke-width: 1; }
    svg .base { stroke: var(--ink); stroke-width: 2.5; }
    svg .ln { fill: none; stroke-width: 2.5; }
    svg .pick { stroke: var(--ink); stroke-width: 2; stroke-dasharray: 5 4; }
    svg .inuse { stroke: var(--violet); stroke-width: 2; }
    svg .scan-hover { pointer-events: none; }
    svg .scan-hover .guide { stroke: var(--muted); stroke-dasharray: 3 3; }
    svg .scan-tooltip rect { fill: var(--paper); stroke: var(--hairline); }
    svg .scan-tooltip text { font-size: 12px; fill: var(--ink); }
    svg.chart:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }

    .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 10px 0 2px; }
    .lg { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
    .lg i { width: 12px; height: 12px; border: 1px solid var(--hairline); flex: none; }

    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 860px) { .split { grid-template-columns: 1fr; } }
    .note { border: 1px solid var(--hairline); background: var(--paper); padding: 10px 13px; }
    .note h3 { margin: 0 0 5px; font-size: 12.5px; }
    .note p { margin: 0; font-size: 12px; color: var(--text-2); line-height: 1.8; }
    .note code { background: var(--cream); border: 1px solid var(--hairline); padding: 0 4px; font-size: 11.5px; }
    .threshold-settings { margin: 16px 0; padding: 14px; background: var(--paper);
      border: 1px solid var(--hairline); border-radius: 12px; }
    .threshold-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
    .threshold-controls input { width: 110px; padding: 8px 10px; border: 1px solid var(--hairline);
      border-radius: 8px; background: var(--cream); color: var(--ink); font: inherit; }
    .threshold-settings p { font-size: 12px; line-height: 1.8; color: var(--text-2); margin: 10px 0 0; }
  </style>
  <link rel="stylesheet" href="/static/apple-theme.css?v=apple-1" />
</head>
<body class="mh-admin">
  <div class="wrap">
    <p class="page-kicker">CAREMATE / WORKSPACE</p>
    <div class="topbar">
      <h1>观测与成本</h1>
      <span class="sub">钱花在哪类问题上 · 指标有没有劣化 · 兜底阈值怎么定的</span>
      <span class="spacer"></span>
      <button class="btn" id="refreshBtn">刷新</button>
    </div>

    <div id="body"><div class="miss">加载中…</div></div>
  </div>

  <div id="toast"></div>
  <script src="/static/admin.js?v=caremate-20261023"></script>
  <script src="/static/acceptance.js"></script>
  <script>
    /* 三块报表各自只画 /api/observability/overview 端出来的那一份:
       成本与校准来自 make 落的产物,趋势来自 eval_runs 表,页面一个数都不重算。
       涨跌箭头是拿同一批行两两相减画出来的,不是另一份数据。 */
    const NS = "http://www.w3.org/2000/svg";
    const METRIC_LABEL = {
      recall_at_5: "Recall@5", recall_at_10: "Recall@10", mrr: "MRR",
      faithfulness: "Faithfulness", refusal_rate: "拒答率",
    };
    const DELTA_EPS = 0.005;      // 和终端趋势表同一条判定线:动静小于它算持平
    const fmt3 = (v) => (v === null || v === undefined ? "—" : Number(v).toFixed(3));
    const pct = (v) => (v === null || v === undefined ? "—" : Math.round(v * 100) + "%");
    const ratePct = v => v === null || v === undefined ? "—"
      : (v * 100).toLocaleString("zh-CN", { maximumFractionDigits: 2 }) + "%";
    const thousands = (n) => (n === null || n === undefined ? "—" : Number(n).toLocaleString("en-US"));

    function svgEl(tag, attrs, txt) {
      const e = document.createElementNS(NS, tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      if (txt !== undefined && txt !== null) e.textContent = txt;
      return e;
    }

    function kpis(items) {
      const box = el("div", "kpis");
      for (const k of items) {
        const c = el("div", "kpi");
        c.appendChild(el("div", "k-label", k.label));
        const v = el("div", "k-val", k.val);
        if (k.unit) v.appendChild(el("small", null, k.unit));
        c.appendChild(v);
        c.appendChild(el("div", "k-sub", k.sub));
        box.appendChild(c);
      }
      return box;
    }

    function table(headers, rows) {
      const t = el("table", "tbl");
      const thead = el("thead"), tr = el("tr");
      for (const h of headers) tr.appendChild(el("th", null, h));
      thead.appendChild(tr);
      t.appendChild(thead);
      const tb = el("tbody");
      for (const r of rows) tb.appendChild(r);
      t.appendChild(tb);
      const scroll = el("div", "scroll-x");
      scroll.appendChild(t);
      return scroll;
    }

    function panelHead(p, title, pill, lede) {
      const h = el("h2", null, title);
      if (pill) h.appendChild(el("span", "pill " + pill[1], pill[0]));
      p.appendChild(h);
      p.appendChild(el("p", "lede", lede));
    }

    /** 三块共用的收尾:重跑按钮 + 日志窗口,按的就是终端那条 make。 */
    function jobFoot(p, block) {
      p.appendChild(el("div", "subhead", "在页面上重跑"));
      p.appendChild(jobRow([block.job], load, block.make));
    }

    /* ---- 01 意图成本账 ---- */
    function costPanel(d) {
      const p = el("div", "panel");
      panelHead(p, "意图成本账", ["数据源 Langfuse", "info"],
        "意图分类节点跑完会给 trace 打一个 intent 标签,按这个标签把 token 分堆一算,"
        + "哪类问题最烧钱就现形了。优化成本先动最贵那条路,不必全局换模型。");
      if (!d.present || !d.rows.length) {
        p.appendChild(missingBox(d.hint));
        jobFoot(p, d);
        return p;
      }
      const m = d.meta, top = d.top;
      p.appendChild(kpis([
        { label: "最烧钱意图", val: top.intent, sub: "占 " + pct(top.share) + " · 单均 " + thousands(top.avg_tokens) + " token" },
        { label: "总 token", val: thousands(d.total_tokens), sub: d.total_requests + " 次提问 · 近 " + m.days + " 天" },
        { label: "意图路数", val: String(d.rows.length), sub: "窗口内有 trace 的意图" },
        { label: "上次跑于", val: (m.generated_at || "—").slice(5), sub: "页面只读产物,不查 Langfuse" },
      ]));

      const shares = el("div", "shares");
      for (const r of d.rows) {
        const w = el("div");
        const lab = el("div", "sh-label");
        const nm = el("div", "nm");
        nm.appendChild(el("b", null, r.intent));
        nm.appendChild(el("span", null, r.count + " 次 · 单均 " + thousands(r.avg_tokens) + " token"));
        lab.appendChild(nm);
        lab.appendChild(el("div", "pv", pct(r.share) + " · " + thousands(r.tokens)));
        w.appendChild(lab);
        const track = el("div", "bar-track");
        const fill = el("span", "bar-fill" + (r === top ? " top" : ""));
        fill.style.width = Math.max(1.5, r.share * 100) + "%";
        track.appendChild(fill);
        w.appendChild(track);
        shares.appendChild(w);
      }
      p.appendChild(shares);

      const rows = d.rows.map((r) => {
        const tr = el("tr");
        tr.appendChild(el("td", null, r.intent));
        tr.appendChild(el("td", "num", String(r.count)));
        tr.appendChild(el("td", "num", thousands(r.tokens)));
        tr.appendChild(el("td", "num", thousands(r.avg_tokens)));
        tr.appendChild(el("td", "num", pct(r.share)));
        return tr;
      });
      p.appendChild(el("div", "subhead", "明细"));
      p.appendChild(table(["意图", "请求数", "总 token", "单均 token", "占比"], rows));

      const most = d.rows.reduce((a, b) => (b.avg_tokens > a.avg_tokens ? b : a), d.rows[0]);
      const read = el("div", "read");
      read.innerHTML = readNoteHtml(d.read_note,
        "总账里 <b>" + top.intent + "</b> 占 <b>" + pct(top.share)
        + "</b>,要瘦成本先瘦它的 prompt 或给它换小模型。单均最高的是 <b>" + most.intent
        + " " + thousands(most.avg_tokens) + "</b> token,单均高说明一次提问背后是多次模型调用"
        + "(ReAct 那类多步工具链就是这样),看的是链路长短,不是问题多。");
      p.appendChild(read);
      jobFoot(p, d);
      return p;
    }

    /* ---- 02 评估趋势 ---- */
    function trendPanel(d) {
      const p = el("div", "panel");
      panelHead(p, "评估趋势", ["数据源 eval_runs 表", "info"],
        "飞轮持续往知识库写东西,评估流水线就是拿来防劣化的。每轮复用 ch04 那套评估集,"
        + "分数落一行,连起来就是趋势。哪天审核放进脏知识把忠实度拉下来,这张表第一时间标出来。");
      if (d.status === "error") {
        p.appendChild(missingBox("趋势读不到:" + (d.note || "")));
        jobFoot(p, d);
        return p;
      }
      if (!d.present) {
        p.appendChild(missingBox(d.hint));
        jobFoot(p, d);
        return p;
      }
      const runs = d.runs, latest = runs[0], prev = runs[1];
      const drops = prev
        ? d.metric_names.filter((n) => (latest.metrics[n] ?? 0) < (prev.metrics[n] ?? 0) - DELTA_EPS)
        : [];
      p.appendChild(kpis([
        { label: "已跑轮次", val: String(runs.length), sub: "最多留最近十轮" },
        { label: "最近一轮", val: fmt3(latest.metrics.faithfulness), sub: "Faithfulness · 生成段有没有编" },
        { label: "检索 MRR", val: fmt3(latest.metrics.mrr), sub: (latest.metrics.recall_at_5 !== undefined
              ? "Recall@5 " + fmt3(latest.metrics.recall_at_5)
              : "Recall@10 " + fmt3(latest.metrics.recall_at_10)) },
        { label: "对比上轮", val: drops.length ? String(drops.length) : "0", unit: " 项下滑",
          sub: drops.length ? drops.map((n) => METRIC_LABEL[n]).join("、") + " 掉了" : "持平或上涨" },
      ]));

      const rows = runs.map((r, i) => {
        const older = runs[i + 1];
        const tr = el("tr");
        tr.appendChild(el("td", null, "#" + r.id));
        tr.appendChild(el("td", null, fmtTime(r.created_at).slice(5, 16)));
        tr.appendChild(el("td", null, r.triggered_by));
        tr.appendChild(el("td", "num", String(r.dataset_size)));
        for (const n of d.metric_names) {
          const v = r.metrics[n], o = older ? older.metrics[n] : undefined;
          let cls = "num", arrow = "";
          if (v !== undefined && v !== null && o !== undefined && o !== null) {
            const delta = v - o;
            cls += delta > DELTA_EPS ? " up" : (delta < -DELTA_EPS ? " down" : " flat");
            arrow = delta > DELTA_EPS ? "↑" : (delta < -DELTA_EPS ? "⚠↓" : "→");
          }
          const td = el("td", cls, fmt3(v));
          if (arrow) td.appendChild(el("span", "arrow", arrow));
          tr.appendChild(td);
        }
        return tr;
      });
      p.appendChild(el("div", "subhead", "最近十轮(新在上)"));
      p.appendChild(table(["轮次", "时间", "触发", "评估集"]
        .concat(d.metric_names.map((n) => METRIC_LABEL[n])), rows));

      const read = el("div", "read");
      read.innerHTML = readNoteHtml(d.read_note, drops.length
        ? "对比上一轮,<b>" + drops.map((n) => METRIC_LABEL[n]).join("、")
          + "</b> 在下滑。先去待审队列翻最近通过的那几条,脏知识进库最常见的表现就是忠实度掉。"
        : "四个指标对上一轮都没退步。趋势的价值不在单轮的绝对分,而在<b>下一轮别掉</b>——"
          + "定时跑起来(cron 每天一轮),劣化才有人看见。");
      p.appendChild(read);
      jobFoot(p, d);
      return p;
    }

    /* ---- 03 置信度阈值校准 ---- */
    function scanChart(svg, scan, pick, inUse) {
      const W = 720, H = 300, M = { l: 42, r: 14, t: 16, b: 46 };
      const plotW = W - M.l - M.r, plotH = H - M.t - M.b, y0 = M.t + plotH;
      const minT = Math.min(.05, inUse ?? .05), maxT = Math.max(.95, inUse ?? .95);
      const xs = (t) => M.l + ((t - minT) / (maxT - minT)) * plotW;
      const ys = (v) => y0 - v * plotH;
      while (svg.firstChild) svg.removeChild(svg.firstChild);
      const grid = svgEl("g", { class: "grid" });
      for (const t of [0, 0.25, 0.5, 0.75, 1]) {
        grid.appendChild(svgEl("line", { x1: M.l, y1: ys(t), x2: M.l + plotW, y2: ys(t) }));
        svg.appendChild(svgEl("text", { x: M.l - 8, y: ys(t) + 3.5, "text-anchor": "end", class: "axis" }, t.toFixed(2)));
      }
      svg.insertBefore(grid, svg.firstChild);
      svg.appendChild(svgEl("line", { x1: M.l, y1: y0, x2: M.l + plotW, y2: y0, class: "base" }));
      for (const t of [minT, 0.2, 0.4, 0.6, 0.8, maxT]) {
        svg.appendChild(svgEl("text", { x: xs(t), y: y0 + 20, "text-anchor": "middle", class: "axis" }, t.toFixed(2)));
      }
      svg.appendChild(svgEl("text", { x: M.l + plotW / 2, y: y0 + 38, "text-anchor": "middle", class: "glabel" }, "阈值 t"));
      const line = (key, color) => {
        const pts = scan.map((r) => xs(r.t).toFixed(1) + "," + ys(r[key]).toFixed(1)).join(" ");
        svg.appendChild(svgEl("polyline", { points: pts, class: "ln", stroke: color }));
      };
      line("pass_rate", "var(--online)");
      line("leak_rate", "var(--error)");
      if (inUse !== null && inUse !== undefined && inUse !== pick) {
        svg.appendChild(svgEl("line", { x1: xs(inUse), y1: M.t, x2: xs(inUse), y2: y0, class: "inuse" }));
      }
      if (pick !== null && pick !== undefined) {
        svg.appendChild(svgEl("line", { x1: xs(pick), y1: M.t, x2: xs(pick), y2: y0, class: "pick" }));
        svg.appendChild(svgEl("text", { x: xs(pick) + 6, y: M.t + 12, class: "glabel" }, "选定 " + pick.toFixed(2)));
      }
      // 沿横轴取最近的真实扫描点，同时显示两条线，重合时也不会挡住另一条。
      if (!scan.length) return;
      const hover = svgEl("g", { class: "scan-hover", visibility: "hidden" });
      const guide = svgEl("line", { class: "guide", y1: M.t, y2: y0 });
      const passDot = svgEl("circle", { r: 4, fill: "var(--online)" });
      const leakDot = svgEl("circle", { r: 4, fill: "var(--error)" });
      const tip = svgEl("g", { class: "scan-tooltip" });
      tip.appendChild(svgEl("rect", { width: 210, height: 76, rx: 8 }));
      const tipRows = [20, 42, 62].map(y => svgEl("text", { x: 12, y }));
      tipRows.forEach(row => tip.appendChild(row));
      hover.append(guide, passDot, leakDot, tip); svg.appendChild(hover);
      let selected = 0;
      const nearest = t => scan.reduce((best, row, i) =>
        Math.abs(row.t - t) < Math.abs(scan[best].t - t) ? i : best, 0);
      const show = i => {
        selected = Math.max(0, Math.min(scan.length - 1, i));
        const row = scan[selected], x = xs(row.t);
        guide.setAttribute("x1", x); guide.setAttribute("x2", x);
        passDot.setAttribute("cx", x); passDot.setAttribute("cy", ys(row.pass_rate));
        leakDot.setAttribute("cx", x); leakDot.setAttribute("cy", ys(row.leak_rate));
        tip.setAttribute("transform", "translate(" + Math.max(M.l, Math.min(x + 12, W - 224)) + ",24)");
        tipRows[0].textContent = "扫描阈值 " + row.t.toFixed(2);
        tipRows[1].textContent = "可答通过率（绿） " + ratePct(row.pass_rate);
        tipRows[2].textContent = "应拒放行率（红） " + ratePct(row.leak_rate);
        hover.setAttribute("visibility", "visible");
        svg.setAttribute("aria-label", tipRows.map(r => r.textContent).join("，") + "。左右方向键查看相邻阈值。");
      };
      const hide = () => hover.setAttribute("visibility", "hidden");
      const pointAt = e => {
        const matrix = svg.getScreenCTM(); if (!matrix) return;
        const point = svg.createSVGPoint(); point.x = e.clientX; point.y = e.clientY;
        const local = point.matrixTransform(matrix.inverse());
        if (local.x < M.l || local.x > W - M.r || local.y < M.t || local.y > y0) { hide(); return; }
        show(nearest(minT + (local.x - M.l) / plotW * (maxT - minT)));
      };
      svg.setAttribute("tabindex", "0"); svg.setAttribute("role", "img");
      svg.setAttribute("aria-label", "阈值扫描图。悬停或使用左右方向键查看可答通过率和应拒放行率。");
      svg.addEventListener("pointermove", pointAt);
      svg.addEventListener("pointerdown", pointAt);
      svg.addEventListener("pointerleave", hide);
      svg.addEventListener("focus", () => show(nearest(inUse ?? pick ?? scan[0].t)));
      svg.addEventListener("blur", hide);
      svg.addEventListener("keydown", e => {
        if (e.key === "ArrowLeft" || e.key === "ArrowRight") { e.preventDefault(); show(selected + (e.key === "ArrowRight" ? 1 : -1)); }
        if (e.key === "Escape") hide();
      });
    }

    function thresholdSettings(d) {
      const box = el("form", "threshold-settings");
      const controls = el("div", "threshold-controls");
      const label = el("label", null, "置信度阈值");
      label.htmlFor = "confidenceThreshold";
      const input = el("input");
      input.id = "confidenceThreshold";
      input.type = "number"; input.min = "0"; input.max = "1"; input.step = "any";
      input.required = true; input.value = d.in_use;
      const save = el("button", "btn ok", "保存阈值");
      save.type = "submit";
      const apply = el("button", "btn", "应用推荐值");
      apply.type = "button";
      const recommended = d.present ? d.recommended?.threshold : undefined;
      apply.disabled = !Number.isFinite(recommended);
      if (Number.isFinite(recommended)) apply.textContent += "（" + recommended.toFixed(2) + "）";
      controls.append(label, input, save, apply);
      box.appendChild(controls);
      const status = el("p", null, "当前生效：" + d.in_use + "。保存后立即用于后续提问，重启后仍保留。");
      status.id = "thresholdStatus"; status.setAttribute("role", "status");
      box.appendChild(status);
      box.appendChild(el("p", null,
        "可设置 0～1。降低阈值会让更多检索证据通过，随后仍须通过模型自评；知识库没有的答案需要补充知识。"));
      const submit = async (value) => {
        if (!Number.isFinite(value) || value < 0 || value > 1) {
          status.textContent = "请输入 0～1 之间的数值。"; return;
        }
        save.disabled = apply.disabled = input.disabled = true;
        status.textContent = "正在保存…";
        try {
          const result = await api("/api/observability/confidence-threshold", {
            method: "PUT", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ threshold: value }),
          });
          status.textContent = "已保存，当前生效：" + result.threshold + "。后续提问使用此值。";
          toast("阈值已保存并生效：" + result.threshold);
          await load();
        } catch (e) { status.textContent = "保存失败：" + e.message; toast("保存失败：" + e.message, true); }
        finally {
          save.disabled = input.disabled = false;
          apply.disabled = !Number.isFinite(recommended);
        }
      };
      box.addEventListener("submit", e => {
        e.preventDefault();
        if (input.value.trim() && input.reportValidity()) submit(Number(input.value));
      });
      apply.addEventListener("click", () => { input.value = recommended; submit(recommended); });
      return box;
    }

    function calibrationPanel(d) {
      const p = el("div", "panel");
      panelHead(p, "置信度阈值校准", ["ch04 评估集实跑", "info"],
        "兜底那道闸卡在什么分上,不是拍脑袋定的。拿评估集里可答的和该拒的两拨题各算一遍"
        + "证据置信度,再扫一遍阈值,看哪条线把两拨分得最开。");
      const w = d.weights;
      p.appendChild(thresholdSettings(d));
      const wnote = el("div", "note");
      wnote.appendChild(el("h3", null, "置信度怎么算出来的"));
      wnote.appendChild(el("p", null,
        "四信号加权:Top1 精排分 " + w.top1 + " / 有效证据数 " + w.valid_count
        + " / Top1-Top2 分差 " + w.margin + " / 关键条款命中 " + w.key_clause
        + "。权重是代码里的常量,校准校的是这条线该划在哪。"));
      if (!d.present) {
        p.appendChild(missingBox(d.hint));
        p.appendChild(wnote);
        jobFoot(p, d);
        return p;
      }
      const rec = d.recommended, dist = d.distribution, currentRates = d.in_use_rates;
      p.appendChild(kpis([
        { label: "推荐阈值", val: rec.threshold.toFixed(2), sub: "Youden J " + fmt3(rec.youden_j) + " · 两拨分得最开的那条线" },
        { label: "在用阈值", val: String(d.in_use),
          sub: d.in_sync ? "与推荐一致" : "可在上方应用推荐值或自定义阈值" },
        { label: "当前可答通过率", val: ratePct(currentRates?.pass_rate),
          sub: currentRates ? "在用阈值 · 最近校准集 ABC 桶" : "当前阈值无精确数据，请重跑校准" },
        { label: "当前应拒放行率", val: ratePct(currentRates?.leak_rate),
          sub: currentRates ? "在用阈值 · 最近校准集 D 桶" : "当前阈值无精确数据，请重跑校准" },
      ]));

      const drows = [["可答(A/B/C 桶)", dist.answerable],
                     ["应拒(D 桶)", dist.absent]].map(([name, s]) => {
        const tr = el("tr");
        tr.appendChild(el("td", null, name));
        for (const k of ["n", "min", "p25", "p50", "p75", "max"]) {
          tr.appendChild(el("td", "num", k === "n" ? String(s.n) : fmt3(s[k])));
        }
        return tr;
      });
      p.appendChild(el("div", "subhead", "证据置信度分布"));
      p.appendChild(table(["题型", "题数", "最低", "p25", "中位", "p75", "最高"], drows));

      const sub = el("div", "subhead", "阈值扫描");
      sub.appendChild(el("span", "unit", "0.05 → 0.95，步进 0.01 · 悬停查看两条线的通过率 / 放行率"));
      p.appendChild(sub);
      const lg = el("div", "legend");
      for (const [label, color] of [["可答通过率", "var(--online)"], ["应拒放行率", "var(--error)"],
                                    ["选定阈值", "var(--ink)"], ["在用阈值", "var(--violet)"]]) {
        const s = el("span", "lg");
        const i = el("i");
        i.style.background = color;
        s.appendChild(i);
        s.appendChild(document.createTextNode(label));
        lg.appendChild(s);
      }
      p.appendChild(lg);
      const scroll = el("div", "chart-scroll");
      const svg = document.createElementNS(NS, "svg");
      svg.setAttribute("class", "chart");
      svg.setAttribute("viewBox", "0 0 720 300");
      scroll.appendChild(svg);
      p.appendChild(scroll);
      scanChart(svg, d.scan, rec.threshold, d.in_use);

      const read = el("div", "read");
      read.innerHTML = readNoteHtml(d.read_note,
        "推荐阈值为 <b>" + rec.threshold.toFixed(2) + "</b>，该轮评估的可答通过率为 <b>"
        + pct(rec.pass_rate) + "</b>，应拒放行率为 <b>" + pct(rec.leak_rate)
        + "</b>。降低阈值通常会减少误拦，同时可能放行更多缺乏证据的问题。");
      p.appendChild(read);

      const split = el("div", "split");
      split.style.marginTop = "14px";
      split.appendChild(wnote);
      const n2 = el("div", "note");
      n2.appendChild(el("h3", null, "什么是「可答被误拦」"));
      n2.appendChild(el("p", null,
        "库里其实有答案,但那一次召回的证据太散(库里写「猫窝清洗保养说明」,用户问"
        + "「能扔洗衣机里洗吗」),精排分上不去,置信度算出来低于线。闸只看证据分,"
        + "不知道「库里有」,于是当成答不上处理。这条问题落池、归并、审核补进知识库,"
        + "下次同样问法就召回得动了。"));
      split.appendChild(n2);
      p.appendChild(split);
      jobFoot(p, d);
      return p;
    }

    async function load() {
      const body = $("body");
      try {
        const d = await api("/api/observability/overview");
        body.innerHTML = "";
        body.appendChild(costPanel(d.cost));
        body.appendChild(trendPanel(d.trend));
        body.appendChild(calibrationPanel(d.calibration));
      } catch (e) {
        body.innerHTML = "";
        body.appendChild(missingBox("取数失败：" + e.message));
        toast("取数失败：" + e.message, true);
      }
    }

    $("refreshBtn").onclick = load;
    mountAdminNav("/observability");
    load();
  </script>
</body>
</html>
